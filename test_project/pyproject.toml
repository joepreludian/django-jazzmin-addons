[project]
name = "test-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jon Trigueiro", email = "joepreludian@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django-jazzmin-addons[django-constance]",
]

[project.scripts]
test-project = "test_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "testproject"

[tool.uv.sources]
django-jazzmin-addons = { workspace = true, editable = true }
