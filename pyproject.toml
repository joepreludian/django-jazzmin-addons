[project]
name = "django-jazzmin-addons"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jon Trigueiro", email = "joepreludian@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-jazzmin>=3.0.5",
]

[project.optional-dependencies]
django-constance = [
  "django-constance"
]
django-allauth = [
  "django-allauth"
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jazzmin_addons"

[tool.uv.workspace]
members = [
    "test_project",
    ".",
]
